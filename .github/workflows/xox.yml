name: xox

on:
  issues:
    types: [opened]

# Ayni anda iki hamle gelirse sirayla islensin, tahta bozulmasin
concurrency:
  group: xox
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  move:
    if: startsWith(github.event.issue.title, 'xox|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Hamleyi oyna
        env:
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: node game/xox.js

      - name: Tahtayi kaydet
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git diff --cached --quiet || git commit -m "XOX: @$ISSUE_USER hamle yapti"
          git push

      - name: Cevap yaz ve kapat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
